name: Backup diario do Supabase

# Roda todo dia as 03h UTC (00h em Brasilia) + execucao manual pela aba Actions
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Fazer o dump do banco de dados
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATA=$(TZ=America/Bahia date +'%Y-%m-%d')
          echo "DATA=${DATA}" >> $GITHUB_ENV
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --schema=public \
            -f "backup-${DATA}.sql"

      - name: Guardar backup por 15 dias
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DATA }}
          path: backup-${{ env.DATA }}.sql
          retention-days: 15
          if-no-files-found: error