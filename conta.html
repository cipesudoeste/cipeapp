<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha senha — CIPE Sudoeste</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shared.css">
<style>
  .ct-wrap{max-width:460px;margin:0 auto;padding:22px 16px 80px;}
  .ct-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .ct-top h1{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;color:var(--ink);}
  .ct-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;}
  .ct-linha{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-muted);}
  .ct-linha:last-child{border-bottom:none;}
  .ct-linha b{color:var(--ink);font-weight:500;text-align:right;word-break:break-all;}
  .ct-link{background:none;border:none;color:var(--ink-faint);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0;margin-top:12px;}
  .ct-link:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="camo-trim camo-bg"></div>
<div class="ct-wrap">
  <div class="ct-top">
    <a class="home-btn" href="index.html" title="Voltar para a página inicial">←</a>
    <h1>Minha senha</h1>
  </div>
  <div class="ct-card">
    <div class="ct-linha"><span>E-mail de acesso</span><b id="ct-email">—</b></div>
    <div class="ct-linha"><span>Formas de entrar</span><b id="ct-formas">—</b></div>
  </div>
  <div class="ct-card" id="ct-form"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-guard.js" data-painel="conta"></script>
<script src="senha-ui.js"></script>
<script>
async function iniciarConta() {
  const sb = window.sbAuth;
  const email = window.usuarioAcesso.email;
  const form = document.getElementById("ct-form");
  document.getElementById("ct-email").textContent = email;

  async function montar() {
    const { data: temSenha } = await sb.rpc("tenho_senha");
    document.getElementById("ct-formas").textContent = temSenha ? "Senha ou código por e-mail" : "Só código por e-mail";
    // quem acabou de entrar por código pode definir senha sem digitar a atual (é o caminho do "esqueci")
    const exigirAtual = !!temSenha && sessionStorage.getItem("cipe-metodo") !== "codigo";
    SenhaUI.montar(form, sb, {
      titulo: temSenha ? "Alterar senha" : "Criar senha",
      texto: temSenha
        ? "Depois de alterar, use a nova senha no próximo acesso."
        : "Você entra hoje só com código por e-mail. Crie uma senha para ter as duas opções.",
      exigirAtual, email,
      botao: temSenha ? "Alterar senha" : "Criar senha",
      aoConcluir: () => { sessionStorage.setItem("cipe-metodo", "senha"); montar(); },
    });
    if (exigirAtual) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ct-link"; b.textContent = "Esqueci minha senha atual";
      b.onclick = async () => {
        await sb.auth.signOut();
        location.replace("login.html?email=" + encodeURIComponent(email) + "&next=conta.html");
      };
      form.appendChild(b);
    }
  }
  montar();
}
window.authPronto ? iniciarConta() : document.addEventListener("auth-pronto", iniciarConta, { once: true });
</script>
</body>
</html>
