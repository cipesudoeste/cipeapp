<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso restrito — CIPE Sudoeste</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shared.css">
<style>
  .login-wrap{min-height:calc(100vh - 7px);display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .login-card{width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px 24px;text-align:center;}
  .login-logos{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;}
  .login-logos img{height:44px;}
  .login-eyebrow{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .login-title{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ink);margin:4px 0 6px;}
  .login-help{font-size:12.5px;color:var(--ink-muted);line-height:1.6;margin:0 0 18px;}
  .login-field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);
    padding:11px 12px;font-size:14px;font-family:inherit;margin-bottom:10px;}
  .login-field:focus{outline:none;border-color:var(--cipe-brown-l);}
  .login-field::placeholder{color:var(--ink-faint);}
  .login-field.codigo{letter-spacing:.3em;text-align:center;font-family:var(--font-mono);font-size:18px;}
  .login-btn{width:100%;justify-content:center;padding:11px 14px;}
  .login-msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--ink-muted);line-height:1.5;}
  .login-msg.erro{color:#e08a72;}
  .login-link{background:none;border:none;color:var(--ink-faint);font-size:12px;margin-top:14px;cursor:pointer;text-decoration:underline;}
  .login-link:hover{color:var(--accent);}
  .etapa{display:none;} .etapa.ativa{display:block;}
</style>
</head>
<body>
<div class="camo-trim camo-bg"></div>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logos">
      <img src="img/logo-cipe.png" alt="CIPE Sudoeste">
      <img src="img/logo-pmba.png" alt="Polícia Militar da Bahia">
    </div>
    <div class="login-eyebrow">CIPE Sudoeste · Acesso restrito</div>
    <div class="login-title">Entrar no painel</div>

    <div class="etapa ativa" id="etapa-email">
      <p class="login-help">Informe seu e-mail. Enviaremos um código de acesso.</p>
      <input type="email" class="login-field" id="login-email" placeholder="seuemail@exemplo.com" autocomplete="email">
      <button type="button" class="ef-btn primary login-btn" id="btn-enviar">Enviar código</button>
    </div>

    <div class="etapa" id="etapa-codigo">
      <p class="login-help">Digite o código enviado para <b id="login-email-alvo"></b>.</p>
      <input type="text" class="login-field codigo" id="login-codigo" inputmode="numeric" maxlength="10" autocomplete="one-time-code" placeholder="••••••">
      <button type="button" class="ef-btn primary login-btn" id="btn-verificar">Entrar</button>
      <button type="button" class="login-link" id="btn-trocar">Usar outro e-mail</button>
    </div>

    <div class="login-msg" id="login-msg"></div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "index.html";
  // só aceita voltar para páginas deste mesmo site
  const destino = /^[a-z0-9\-]+\.html(\?.*)?$/i.test(next) ? next : "index.html";
  const $ = (id) => document.getElementById(id);
  let email = "";

  function msg(texto, erro) {
    $("login-msg").textContent = texto || "";
    $("login-msg").className = "login-msg" + (erro ? " erro" : "");
  }
  function etapa(id) {
    document.querySelectorAll(".etapa").forEach((e) => e.classList.remove("ativa"));
    $(id).classList.add("ativa");
  }

  const motivos = {
    "sem-acesso": "Sua conta não tem permissão para os painéis. Fale com o administrador.",
    "erro": "Não foi possível confirmar seu acesso. Entre novamente.",
    "config": "Configuração do sistema ausente.",
  };
  if (params.get("motivo")) msg(motivos[params.get("motivo")] || "", true);

  async function entrarSeJaLogado() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    const { data: acesso } = await sb.rpc("meu_acesso");
    if (acesso) location.replace(destino);
  }
  if (params.get("motivo") !== "sem-acesso") entrarSeJaLogado();

  $("btn-enviar").addEventListener("click", async () => {
    email = $("login-email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg("Informe um e-mail válido.", true);
    $("btn-enviar").disabled = true;
    msg("Enviando código...");
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    $("btn-enviar").disabled = false;
    if (error) {
      console.error(error);
      // mensagem genérica: não revela se o e-mail existe ou não
      return msg("Não foi possível enviar o código para esse e-mail. Confira o endereço ou fale com o administrador.", true);
    }
    $("login-email-alvo").textContent = email;
    etapa("etapa-codigo");
    msg("");
    $("login-codigo").focus();
  });

  $("btn-verificar").addEventListener("click", async () => {
    const token = $("login-codigo").value.replace(/\s/g, "");
    if (!token) return msg("Digite o código recebido.", true);
    $("btn-verificar").disabled = true;
    msg("Verificando...");
    const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
    if (error) {
      $("btn-verificar").disabled = false;
      return msg("Código inválido ou expirado.", true);
    }
    const { data: acesso } = await sb.rpc("meu_acesso");
    if (!acesso) {
      await sb.auth.signOut();
      $("btn-verificar").disabled = false;
      etapa("etapa-email");
      return msg(motivos["sem-acesso"], true);
    }
    location.replace(destino);
  });

  $("btn-trocar").addEventListener("click", () => { etapa("etapa-email"); msg(""); });
  $("login-email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-enviar").click(); });
  $("login-codigo").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-verificar").click(); });
})();
</script>
</body>
</html>
